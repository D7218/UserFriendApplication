<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friends</title>
    <link rel="stylesheet" th:href="@{/css/friends.css}">
    <!-- Same UI styling -->
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title {
            margin: 0;
            font-size: 32px;
        }

        .page-subtitle {
            color: #6b7280;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .search-input {
            width: 350px;
            max-width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #f8fafc;
            color: #64748b;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fafc;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #2563eb;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="page-header">

        <div>

            <h1 class="page-title">Friends</h1>

            <p class="page-subtitle">
                Manage user's friends
            </p>

        </div>


        <div class="header-buttons">

            <!-- Back to Users -->

            <a th:href="@{/users}"
               class="btn btn-secondary">

                ← Users

            </a>


            <!-- Add Friend -->

            <!-- Pass userId -->

            <a th:href="@{/users/{userId}/friends/new(userId=${userId})}"
               class="btn btn-primary">

                + Add Friend

            </a>

        </div>

    </div>


    <div class="card">

        <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search friend..."
        >


        <table id="friendsTable">

            <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>

            </thead>


            <tbody>

            <tr th:each="friend : ${friends}">

                <td th:text="${friend.id}"></td>

                <td th:text="${friend.name}"></td>

                <td th:text="${friend.email}"></td>


                <td>

                    <div class="actions">

                        <a
                                th:href="@{/users/{userId}/friends/edit/{friendId}
                                (userId=${userId}, friendId=${friend.id})}"
                                class="action-btn edit-btn">

                            Edit

                        </a>


                        <form
                                th:action="@{/users/{userId}/friends/delete/{friendId}
                                (userId=${userId}, friendId=${friend.id})}"
                                method="post">

                            <button
                                    type="submit"
                                    class="action-btn delete-btn"
                                    onclick="return confirm('Delete this friend?')">

                                Delete

                            </button>

                        </form>

                    </div>

                </td>

            </tr>


            <tr th:if="${friends == null or #lists.isEmpty(friends)}">

                <td colspan="4" class="empty">
                    No friends found
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

    document
        .getElementById("searchInput")
        .addEventListener("keyup", function () {

            const value =
                this.value.toLowerCase();

            document
                .querySelectorAll("#friendsTable tbody tr")
                .forEach(row => {

                    const text =
                        row.textContent.toLowerCase();

                    row.style.display =
                        text.includes(value)
                            ? ""
                            : "none";

                });

        });

</script>

</body>
</html>

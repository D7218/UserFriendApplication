<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Management</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
        }

        .friends-btn {
            background: #dcfce7;
            color: #15803d;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        .edit-btn {
            background: #dbeafe;
            color: #2563eb;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="page-header">

        <div>
            <h1>User Management</h1>
            <p>Manage users and their friends</p>
        </div>

        <a th:href="@{/users/new}" class="btn">
            + Add New User
        </a>

    </div>


    <div class="card">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.id}"></td>

                <td th:text="${user.name}"></td>

                <td th:text="${user.email}"></td>

                <td>

                    <a
                            th:href="@{/users/edit/{id}(id=${user.id})}"
                            class="edit-btn">
                        Edit
                    </a>

                    <a
                            th:href="@{/friends/user/{id}(id=${user.id})}"
                            class="friends-btn">
                        Friends
                    </a>

                    <form
                            th:action="@{/users/delete/{id}(id=${user.id})}"
                            method="post"
                            style="display: inline;">

                        <button
                                type="submit"
                                class="delete-btn">

                            Delete

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>
            <link rel="stylesheet" th:href="@{/css/users.css}">

        </table>

    </div>

</div>

</body>
</html>
